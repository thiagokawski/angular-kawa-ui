<div class="page">
  <header class="page__header">
    <h1>Icon Button</h1>
    <p>
      <code>button[kw-icon-button]</code>, <code>a[kw-icon-button]</code> — botão quadrado só de
      ícone, com <code>label</code> obrigatório.
    </p>
  </header>

  <div class="page__sections">
    <app-example
      title="Variantes"
      description="solid, outline e ghost, na cor secondary (padrão ghost)."
      [html]="examples.variants"
    >
      @for (variant of variants; track variant) {
        <button kw-icon-button [variant]="variant" label="Editar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" />
          </svg>
        </button>
      }
    </app-example>

    <app-example
      title="Tamanhos"
      description="sm (32px), md (40px, padrão) e lg (48px). O ícone acompanha: 16, 20 e 24px."
      [html]="examples.sizes"
    >
      @for (size of sizes; track size) {
        <button kw-icon-button variant="outline" [size]="size" label="Adicionar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      }
    </app-example>

    <app-example
      title="Cores"
      description="Uma intenção por botão, na variante solid."
      [html]="examples.colors"
    >
      @for (color of colors; track color) {
        <button kw-icon-button variant="solid" [color]="color" [label]="'Remover (' + color + ')'">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
        </button>
      }
    </app-example>

    <app-example
      title="Arredondado"
      description="rounded deixa o botão redondo. Use em ações flutuantes ou de destaque."
      [html]="examples.rounded"
    >
      <button kw-icon-button rounded variant="solid" label="Adicionar">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </app-example>

    <app-example
      title="Loading"
      description="loading mostra o spinner no lugar do ícone e bloqueia o clique. Simular envio liga loading por 2 s."
      [html]="examples.loading"
      [ts]="examples.loadingTs"
    >
      <button kw-icon-button variant="outline" loading label="Salvando"></button>
      <button
        kw-icon-button
        variant="outline"
        [loading]="saving()"
        (click)="simulate()"
        label="Salvar"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6" />
        </svg>
      </button>
    </app-example>

    <app-example
      title="Desabilitado"
      description="No button use o atributo disabled nativo. No a, use aria-disabled."
      [html]="examples.disabled"
    >
      <button kw-icon-button disabled label="Excluir">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
        </svg>
      </button>
      <a kw-icon-button aria-disabled="true" label="Abrir">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M14 4h6v6M20 4l-9 9M19 14v5H5V5h5" />
        </svg>
      </a>
    </app-example>

    <app-example
      title="Como link"
      description="a[kw-icon-button] com href. Use target e rel quando abrir em nova aba."
      [html]="examples.link"
    >
      <a
        kw-icon-button
        href="https://angular.dev"
        target="_blank"
        rel="noopener"
        label="Abrir angular.dev"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M14 4h6v6M20 4l-9 9M19 14v5H5V5h5" />
        </svg>
      </a>
    </app-example>
  </div>
</div>
