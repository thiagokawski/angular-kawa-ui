<div class="page">
  <header class="page__header">
    <h1>Input Group</h1>
    <p><code>kw-input-group</code> — agrupa um input com elementos ao redor.</p>
  </header>

  <div class="page__sections">
    <app-example
      title="Ícone de prefixo"
      description="Lupa em SVG inline com kw-prefix."
      [html]="examples.prefixIcon.html"
    >
      <div class="field">
        <kw-input-group>
          <svg
            kw-prefix
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input kw-input placeholder="Buscar" />
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Texto de prefixo e sufixo"
      description="Span com kw-prefix e kw-suffix em volta do input."
      [html]="examples.prefixSuffixText.html"
    >
      <div class="field">
        <kw-input-group>
          <span kw-prefix>R$</span>
          <input kw-input placeholder="0" />
          <span kw-suffix>,00</span>
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Botão de sufixo: mostrar senha"
      description="Alterna o type do input entre password e text."
      [html]="examples.passwordToggle.html"
      [ts]="examples.passwordToggle.ts"
    >
      <div class="field">
        <kw-input-group>
          <input kw-input [type]="showPassword() ? 'text' : 'password'" placeholder="Senha" />
          <button
            kw-button
            kw-suffix
            variant="ghost"
            iconOnly
            type="button"
            [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
            (click)="showPassword.update((v) => !v)"
          >
            @if (showPassword()) {
              <svg
                kw-icon-start
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path
                  d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"
                />
                <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" x2="22" y1="2" y2="22" />
              </svg>
            } @else {
              <svg
                kw-icon-start
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Botão de sufixo: limpar"
      description="O botão aparece somente quando há texto no campo."
      [html]="examples.clearButton.html"
      [ts]="examples.clearButton.ts"
    >
      <div class="field">
        <kw-input-group>
          <svg
            kw-prefix
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input kw-input placeholder="Buscar" [value]="search()" (input)="onSearch($event)" />
          @if (search()) {
            <button
              kw-button
              kw-suffix
              variant="ghost"
              iconOnly
              type="button"
              aria-label="Limpar"
              (click)="search.set('')"
            >
              <svg
                kw-icon-start
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M18 6 6 18" />
                <path d="m6 6 12 12" />
              </svg>
            </button>
          }
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Lado a lado com input isolado"
      description="Compare a altura do input isolado com a do grupo."
      [html]="examples.sideBySide.html"
    >
      <div class="row">
        <div class="field">
          <input kw-input placeholder="Input isolado" />
        </div>
        <div class="field">
          <kw-input-group>
            <span kw-prefix>R$</span>
            <input kw-input placeholder="Dentro de um grupo" />
            <span kw-suffix>,00</span>
          </kw-input-group>
        </div>
      </div>
    </app-example>

    <app-example
      title="Inválido"
      description='Borda danger forçada com [valid]="false".'
      [html]="examples.invalid.html"
    >
      <div class="field">
        <kw-input-group>
          <span kw-prefix>R$</span>
          <input kw-input [valid]="false" placeholder="Valor" />
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Desabilitado"
      description="Grupo com opacidade reduzida quando o input está disabled."
      [html]="examples.disabled.html"
    >
      <div class="field">
        <kw-input-group>
          <span kw-prefix>R$</span>
          <input kw-input disabled placeholder="Valor" />
          <span kw-suffix>,00</span>
        </kw-input-group>
      </div>
    </app-example>

    <app-example
      title="Reactive Forms e Signal Forms"
      description="Preencha e saia do campo sem valor para ver a borda danger."
      [html]="examples.forms.html"
      [ts]="examples.forms.ts"
    >
      <div class="row">
        <div class="field">
          <kw-input-group>
            <svg
              kw-prefix
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              kw-input
              [formControl]="reactiveControl"
              placeholder="Reactive Forms (obrigatório)"
            />
          </kw-input-group>
        </div>
        <div class="field">
          <kw-input-group>
            <svg
              kw-prefix
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input
              kw-input
              [formField]="signalForm.name"
              placeholder="Signal Forms (obrigatório)"
            />
          </kw-input-group>
        </div>
      </div>
    </app-example>
  </div>
</div>
